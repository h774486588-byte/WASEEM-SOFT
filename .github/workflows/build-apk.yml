name: بناء تطبيق WASEEM MEDICAL PRO APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: تحميل المستودع
        uses: actions/checkout@v4


      # ==========================================
      # 2. إعداد Java
      # ==========================================
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. استخدام Android SDK الموجود مسبقاً
      # ==========================================
      - name: إعداد Android SDK
        shell: bash
        run: |

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"

          ls -la "$ANDROID_SDK_ROOT"


      # ==========================================
      # 4. تثبيت Android SDK المطلوب
      # ==========================================
      - name: تثبيت أدوات Android
        shell: bash
        run: |

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 5. العثور على ملف ZIP
      # ==========================================
      - name: البحث عن ملف ZIP
        shell: bash
        run: |

          echo "الملفات المضغوطة الموجودة:"

          find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*"

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then

            echo "❌ لم يتم العثور على ملف ZIP"

            exit 1

          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "✅ تم العثور على:"
          echo "$ZIP_FILE"


      # ==========================================
      # 6. فك ضغط ZIP
      # ==========================================
      - name: استخراج المشروع
        shell: bash
        run: |

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "================================"
          echo "محتويات المشروع"
          echo "================================"

          find extracted -maxdepth 4 -type f | head -200


      # ==========================================
      # 7. البحث عن index.html
      # ==========================================
      - name: البحث عن تطبيق الويب
        shell: bash
        run: |

          INDEX_FILE=$(find extracted \
            -type f \
            -iname "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then

            echo "❌ لم يتم العثور على index.html"

            echo "الملفات الموجودة:"

            find extracted -type f

            exit 1

          fi

          WEB_DIR=$(dirname "$INDEX_FILE")

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "✅ تم العثور على التطبيق:"

          echo "$INDEX_FILE"


      # ==========================================
      # 8. إنشاء مشروع Android
      # ==========================================
      - name: إنشاء مشروع Android
        shell: bash
        run: |

          rm -rf android-app

          mkdir -p android-app

          mkdir -p android-app/app/src/main/java/com/waseem/medical

          mkdir -p android-app/app/src/main/res/values

          mkdir -p android-app/app/src/main/assets


      # ==========================================
      # 9. نسخ تطبيق الويب
      # ==========================================
      - name: نسخ تطبيق الويب
        shell: bash
        run: |

          cp -R "$WEB_DIR"/. \
            android-app/app/src/main/assets/

          echo "✅ تم نسخ ملفات التطبيق"


      # ==========================================
      # 10. settings.gradle
      # ==========================================
      - name: إنشاء settings.gradle
        shell: bash
        run: |

          cat > android-app/settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "WASEEM-MEDICAL-PRO"

          include(":app")

          EOF


      # ==========================================
      # 11. build.gradle
      # ==========================================
      - name: إنشاء build.gradle
        shell: bash
        run: |

          cat > android-app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'
                  version '8.7.3'
                  apply false

          }

          EOF


      # ==========================================
      # 12. gradle.properties
      # ==========================================
      - name: إنشاء gradle.properties
        shell: bash
        run: |

          cat > android-app/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          EOF


      # ==========================================
      # 13. app/build.gradle
      # ==========================================
      - name: إنشاء إعداد التطبيق
        shell: bash
        run: |

          cat > android-app/app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }

          android {

              namespace 'com.waseem.medical'

              compileSdk 35

              defaultConfig {

                  applicationId "com.waseem.medical"

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                  }

                  release {

                      minifyEnabled false

                  }

              }

          }

          EOF


      # ==========================================
      # 14. AndroidManifest
      # ==========================================
      - name: إنشاء AndroidManifest
        shell: bash
        run: |

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application

                  android:allowBackup="true"

                  android:usesCleartextTraffic="true"

                  android:label="نظام وسيم الطبي PRO"

                  android:theme="@style/AppTheme">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF


      # ==========================================
      # 15. تصميم Android
      # ==========================================
      - name: إنشاء Theme
        shell: bash
        run: |

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:statusBarColor">
                      #0D4778
                  </item>

                  <item name="android:navigationBarColor">
                      #0D4778
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>

          EOF


      # ==========================================
      # 16. MainActivity
      # ==========================================
      - name: إنشاء MainActivity
        shell: bash
        run: |

          cat > android-app/app/src/main/java/com/waseem/medical/MainActivity.java <<'EOF'

          package com.waseem.medical;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }

          }

          EOF


      # ==========================================
      # 17. ProGuard
      # ==========================================
      - name: إنشاء ProGuard
        shell: bash
        run: |

          echo "# WASEEM MEDICAL PRO" \
            > android-app/app/proguard-rules.pro


      # ==========================================
      # 18. إعداد Gradle
      # ==========================================
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 19. بناء APK
      # ==========================================
      - name: بناء APK
        working-directory: android-app
        shell: bash
        run: |

          gradle assembleDebug --no-daemon


      # ==========================================
      # 20. تجهيز APK
      # ==========================================
      - name: تجهيز ملف APK
        shell: bash
        run: |

          mkdir -p output

          cp \
            android-app/app/build/outputs/apk/debug/app-debug.apk \
            output/WASEEM-MEDICAL-PRO.apk

          ls -lh output/


      # ==========================================
      # 21. رفع APK
      # ==========================================
      - name: رفع APK
        uses: actions/upload-artifact@v4

        with:

          name: WASEEM-MEDICAL-PRO-APK

          path: output/WASEEM-MEDICAL-PRO.apk

          retention-days: 30
